server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types application/json text/css application/javascript image/svg+xml;

  # Synced data files: always revalidate (cheap 304s), and a real 404 when a
  # file is missing instead of falling back to the app's index.html.
  location /data/ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Hashed build output never changes, so it can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The app shell must be revalidated so the display picks up new deployments.
  location / {
    add_header Cache-Control "no-cache";
    index index.html index.htm;
    try_files $uri $uri/ /index.html;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
